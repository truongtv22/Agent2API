name: build-macos-arm64

# 只编 macOS arm64 安装包。不派发到构建仓库，也不编其它平台。
# 手动触发，避免每次推分支都占用 macOS runner。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 macOS arm64 安装包
        run: npm --prefix desktop-tauri run build -- --target aarch64-apple-darwin

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 读取版本号
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("desktop-tauri/src-tauri/tauri.conf.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=macos-arm64-$version" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          dmg=(target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          notes="$(printf 'macOS arm64 build of %s.\n\nFile: %s\nCommit: %s\n' "$version" "$(basename "${dmg[0]}")" "$GITHUB_SHA")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${dmg[0]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --prerelease=false --latest \
              --title "$version macOS arm64" \
              --notes "$notes" \
              --target "$GITHUB_REF_NAME"
          else
            gh release create "$tag" "${dmg[0]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_REF_NAME" --latest \
              --title "$version macOS arm64" \
              --notes "$notes"
          fi
